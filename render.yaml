services:
  - type: web
    name: bovet-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: OTP_HMAC_KEY
        generateValue: true
      - key: ACCESS_TOKEN_MINUTES
        value: "720"
      - key: APP_ORIGIN
        sync: false
      - key: BREVO_API_KEY
        sync: false

  - type: web
    name: bovet-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://bovet-api.onrender.com/api
